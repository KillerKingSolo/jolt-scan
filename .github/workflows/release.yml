name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch Tick Studio files, build and self-test the scanner
        run: python app/setup_scanner.py
      - name: Checks
        run: python tools/check.py --tag ${{ github.ref_name }} --no-build
      - name: Package (Jolt Scan code only, no Tick Studio files)
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="jolt-scan-$v/" -o "jolt-scan-$v.zip" HEAD
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "jolt-scan-${GITHUB_REF_NAME#v}.zip" --title "Jolt Scan ${GITHUB_REF_NAME#v}" --notes-file notes.md
